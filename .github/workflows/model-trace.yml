name: model-trace

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [main]
    tags: ["model-trace-v*"]
  pull_request:

defaults:
  run:
    shell: bash

env:
  PLUGIN_DIR: .
  TARGET: x86_64-unknown-linux-gnu

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: fmt
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path Cargo.toml --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path Cargo.toml --locked
      - name: build linux binary
        run: cargo build --manifest-path Cargo.toml --release --locked --target ${{ env.TARGET }}
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: model-trace-binary
          path: target/${{ env.TARGET }}/release/model-trace
          if-no-files-found: error

  package:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: actions/download-artifact@v4
        with:
          name: model-trace-binary
          path: target/${{ env.TARGET }}/release
      - name: build plugin CLI
        run: |
          git clone --depth 50 https://github.com/zyycn/codex-proxy-rs.git /tmp/codex-proxy-rs
          cd /tmp/codex-proxy-rs
          git checkout 9c1067676495623111497111b7cb136544fe1828
          cargo build --manifest-path backend/Cargo.toml --release --locked -p codex-proxy-plugin-cli
      - name: package
        run: |
          chmod +x target/${{ env.TARGET }}/release/model-trace
          /tmp/codex-proxy-rs/backend/target/release/cpr-plugin package \
            --manifest plugin.json \
            --binary target/${{ env.TARGET }}/release/model-trace \
            --target ${{ env.TARGET }} \
            --resource-map ui=ui \
            --output-dir dist
      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: model-trace-package
          path: dist/
          if-no-files-found: error
      - name: release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
